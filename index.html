<!DOCTYPE html>
<html>
<head>
  <title>Finanzas & Café</title>

  <style>
    body {
      background-color: lightblue;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .widget {
      margin: 40px auto;
      width: 90%;
      max-width: 500px;
    }
  </style>
</head>

<body>

  <h1>☕ Finanzas & Café</h1>
  <p>Avanzando de a poco...</p>

  <h2>📊 Índices en vivo</h2>

  <div class="widget">
    <!-- TradingView Widget BEGIN -->
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>

      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
      {
        "colorTheme": "light",
        "dateRange": "1D",
        "showChart": false,
        "locale": "es",
        "width": "100%",
        "height": "400",
        "tabs": [
          {
            "title": "Índices",
            "symbols": [
              { "s": "SP:SPX", "d": "S&P 500" },
              { "s": "BCBA:IMV", "d": "S&P Merval" }
            ]
          }
        ]
      }
      </script>
    </div>
    <!-- TradingView Widget END -->
  </div>

</body>
</html>
