<!DOCTYPE html>
<html>
<head>
  <title>Finanzas & Café</title>
  <style>
    body {
      background-color: #f5f5dc; /* color hueso */
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 {
      margin-top: 30px;
    }
    .widget {
      margin: 20px auto;
      width: 350px;
    }
  </style>
</head>
<body>
  <h1>☕ Finanzas & Café</h1>
  <p>Avanzando de a poco...</p>

  <h2>📊 Índices en vivo</h2>

  <div class="widget" id="spx_widget"></div>
  <div class="widget" id="dji_widget"></div>
  <div class="widget" id="imv_widget"></div>
  <div class="widget" id="ibov_widget"></div>

  <script src="https://s3.tradingview.com/tv.js"></script>
  <script>
    // S&P 500
    new TradingView.MiniWidget({
      "container_id": "spx_widget",
      "symbol": "SP:SPX",
      "width": 350,
      "height": 180,
      "locale": "es",
      "colorTheme": "light"
    });

    // Dow Jones
    new TradingView.MiniWidget({
      "container_id": "dji_widget",
      "symbol": "DJ:DJI",
      "width": 350,
      "height": 180,
      "locale": "es",
      "colorTheme": "light"
    });

    // S&P Merval
    new TradingView.MiniWidget({
      "container_id": "imv_widget",
      "symbol": "BCBA:IMV",
      "width": 350,
      "height": 180,
      "locale": "es",
      "colorTheme": "light"
    });

    // Ibovespa
    new TradingView.MiniWidget({
      "container_id": "ibov_widget",
      "symbol": "BMFBOVESPA:IBOV",
      "width": 350,
      "height": 180,
      "locale": "es",
      "colorTheme": "light"
    });
  </script>
</body>
</html>
