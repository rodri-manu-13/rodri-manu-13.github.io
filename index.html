<!DOCTYPE html>
<html>
  <head>
    <title>Finanzas & Café</title>

    <style>
      body {
        background-color: lightblue;
        font-family: Arial, sans-serif;
        text-align: center;
      }

      h1 {
        margin-top: 30px;
      }

      .widget {
        margin: 30px auto;
        width: 350px;
      }
    </style>
  </head>

  <body> 
    <h1>☕ Finanzas & Café</h1>
    <p>Avanzando de a poco...</p>

    <h2>📊 S&P 500</h2>
    <div class="widget">
      <div id="sp500_widget"></div>
    </div>

    <h2>📊 S&P Merval</h2>
    <div class="widget">
      <div id="merval_widget"></div>
    </div>

    <!-- Script de TradingView -->
    <script src="https://s3.tradingview.com/tv.js"></script>

    <script>
      new TradingView.MiniWidget({
        "container_id": "sp500_widget",
        "symbol": "SP:SPX",
        "width": "350",
        "height": "220",
        "locale": "es",
        "dateRange": "1D",
        "colorTheme": "light"
      });

      new TradingView.MiniWidget({
        "container_id": "merval_widget",
        "symbol": "BCBA:IMV",
        "width": "350",
        "height": "220",
        "locale": "es",
        "dateRange": "1D",
        "colorTheme": "light"
      });
    </script>

  </body>
</html>
